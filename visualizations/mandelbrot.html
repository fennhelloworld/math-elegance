<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandelbrot Explorer — 数学之美</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: monospace; }
canvas { display: block; cursor: crosshair; }
#info {
  position: absolute; top: 10px; left: 10px;
  color: #0f0; font-size: 12px; background: rgba(0,0,0,0.7);
  padding: 8px 12px; border-radius: 4px;
}
#info span { color: #fff; }
button {
  position: absolute; top: 10px; right: 10px;
  background: #333; color: #0f0; border: 1px solid #0f0;
  padding: 8px 16px; cursor: pointer; font-family: monospace;
  border-radius: 4px;
}
button:hover { background: #0f0; color: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  Zoom: <span id="zoom">1</span>x | Center: <span id="center">-0.5 + 0i</span> | Iterations: <span id="maxIter">200</span>
  <br>Click to zoom in | Right-click to zoom out
</div>
<button onclick="reset()">Reset</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, maxIter = 200;
let cx = -0.5, cy = 0, scale = 3;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  render();
}

function getColor(n, maxIter) {
  if (n === maxIter) return [0, 0, 0];
  const t = n / maxIter;
  const r = Math.floor(9 * (1 - t) * t * t * t * 255);
  const g = Math.floor(15 * (1 - t) * (1 - t) * t * t * 255);
  const b = Math.floor(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255);
  return [r, g, b];
}

function render() {
  const img = ctx.createImageData(W, H);
  for (let px = 0; px < W; px++) {
    for (let py = 0; py < H; py++) {
      const x0 = cx + (px - W/2) * scale / W;
      const y0 = cy + (py - H/2) * scale / W;
      let x = 0, y = 0, iter = 0;
      while (x*x + y*y <= 4 && iter < maxIter) {
        const xt = x*x - y*y + x0;
        y = 2*x*y + y0;
        x = xt;
        iter++;
      }
      // Smooth coloring
      const smooth = iter < maxIter ? iter + 1 - Math.log(Math.log2(Math.sqrt(x*x + y*y))) : iter;
      const [r, g, b] = getColor(smooth, maxIter);
      const idx = (py * W + px) * 4;
      img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('zoom').textContent = (3/scale).toFixed(1);
  document.getElementById('center').textContent = `${cx.toFixed(10)} + ${cy.toFixed(10)}i`;
  document.getElementById('maxIter').textContent = maxIter;
}

canvas.addEventListener('click', (e) => {
  const nx = cx + (e.clientX - W/2) * scale / W;
  const ny = cy + (e.clientY - H/2) * scale / W;
  cx = nx; cy = ny;
  scale *= 0.5;
  maxIter = Math.min(maxIter + 50, 2000);
  render();
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  scale *= 2;
  maxIter = Math.max(maxIter - 50, 200);
  render();
});

function reset() {
  cx = -0.5; cy = 0; scale = 3; maxIter = 200;
  render();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
